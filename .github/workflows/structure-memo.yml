name: Structure memo issue

# ヒアリング生メモIssue（memoラベル）が開かれたら、Claudeが構造化Issueに変換し、
# 元メモをクローズする。スマホからメモを1個openするだけで運用が回る想定。

on:
  issues:
    types: [opened]

jobs:
  structure:
    # 3つのガード:
    #  1) ループ防止: memoラベル付きのみ対象（生成する構造化Issueにはmemoを付けない）
    #  2) オーナー限定: 他人のIssueでAIを乱用させない
    #  3) シークレットはActions secrets（CLAUDE_CODE_OAUTH_TOKEN）
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      contains(github.event.issue.labels.*.name, 'memo')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # gh CLI の実行を明示許可しないと Issue 作成・コメント・クローズが
          # すべて権限拒否され、何もせず success で終わってしまう。
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh issue list:*),Bash(gh label create:*),Bash(gh label list:*)"
          prompt: |
            あなたはリポジトリ ${{ github.repository }} のメンテナ補助です。
            Issue #${{ github.event.issue.number }} はヒアリングの生メモです
            （「店舗情報の報告」か「機能要望」のどちらか）。
            次を実行してください（gh CLI が利用できます）:

            1. メモ本文を読み、種別（店舗情報 / 機能要望）を判定して構造化する。
            2. `gh issue create` で新しい構造化Issueを作成する。
               本文は**必ず下記テンプレートをそのまま使い、文体・見出し・項目を統一する**こと。
               表・チェックボックス・HTMLエンティティ（&#10; 等）は使わない。値は簡潔な体言止めで、
               不明な項目は「不明」と書く（項目自体は省略しない）。

               - 【店舗情報の場合】 ラベル: `要反映`
                 - タイトル: 「[店舗報告] <店名> — <要点>」
                 - 本文テンプレート:
                   ```
                   ## 店舗
                   - 店名: <店名>
                   - 推定 store-id: `<id・不明なら不明>`

                   ## 報告
                   - 対象タイトル: <ラスサバ / イニブ / 両方>
                   - 種別: <台数修正 / 閉店 / 移設 / ピン位置 / 設備 / その他>
                   - 台数: <ゲーム別。例「イニブ 8台 / ラスサバ 3台」。ライブモニター込み等の注記は残す>
                   - 出どころ: <自分で確認 / SNS / 又聞き / 不明>

                   ## 原文メモ
                   > <原文の引用>
                   ```

               - 【機能要望の場合】 ラベル: `改善要望`
                 - タイトル: 「[要望] <要点>」
                 - 本文テンプレート:
                   ```
                   ## 要望
                   <やりたいこと>

                   ## 背景・きっかけ
                   <背景・きっかけ>

                   ## 想定ユーザー
                   <想定ユーザー>

                   ## 原文メモ
                   > <原文の引用>
                   ```

               - 生成Issueに `memo` は付けない。使うラベルが無ければ
                 `gh label create <名前>` で作成してから付与する。
            3. 元の Issue #${{ github.event.issue.number }} に、作成した新Issueへのリンクをコメントし、
               `gh issue close ${{ github.event.issue.number }}` でクローズする。

            重要: データファイルの編集・コミット・PR作成は行わないこと。
            Issueの作成・コメント・クローズのみを行う（自動でデータは変更しない）。

      # 構造化に失敗したらIssueを作成（メモの取りこぼし防止）
      - name: 失敗したらIssueを作成
        if: failure()
        uses: ./.github/actions/report-failure
