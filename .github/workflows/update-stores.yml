name: 設置店舗データ自動更新

# 定期スケジュールと手動起動で、ビルド前の静的データ生成パイプラインを実行する（Req2.5）。
# ランタイムのAPIサーバー/データベースは導入せず、生成物 stores.json を再生成して
# 差分がある場合のみ PR を作成する。main への直 push はせず、人がレビュー・マージした
# 時点で Vercel の本番デプロイが発火する（自動更新が無確認で本番へ出るのを防ぐ）。
on:
  schedule:
    # 毎週水曜 09:24 JST（= 00:24 UTC）。真夜中UTCぴったりは遅延・欠落しやすいため分をずらす
    - cron: '24 0 * * 3'
  workflow_dispatch:

# PR 作成（ブランチ push + Pull Request 作成）、失敗時のIssue作成に必要（Req2.5）
permissions:
  contents: write
  pull-requests: write
  issues: write

# 同時実行を直列化し、push 競合を防ぐ（実行中ジョブはキャンセルしない）
concurrency:
  group: update-stores
  cancel-in-progress: false

jobs:
  update-stores:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        # バージョンは package.json の packageManager に従う（with: version を指定すると二重指定で ERR_PNPM_BAD_PM_VERSION になる）
        uses: pnpm/action-setup@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      # スクレイプ→マージ→ジオコード→生成を連結。失敗時は process.exitCode=1 で
      # このステップが失敗し、後続のコミット段へ進まない（既存データを破壊しない・Req2.6）。
      - name: データ更新パイプラインを実行
        env:
          # 地図表示用とは分離したジオコーディング専用キー（CI Secret 管理）
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
        run: pnpm exec tsx scripts/pipeline.ts

      # 実体差分がある場合のみ PR を作成・更新する。差分ゲートにより stores.json は
      # 実体差分が無ければ書き換わらないため、変更が無ければ create-pull-request は
      # 何もせず PR を作らない（Req2.7）。ジオコードキャッシュの追記分も対象に含める。
      # 固定ブランチ auto/update-stores を使い回すため、再実行のたびに PR が乱立せず
      # 同じ PR が更新される。レビュー・マージは人が行う。
      - name: 差分があればPRを作成
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src/data/stores.json
            scripts/cache/geocode.json
          commit-message: 'chore: 設置店舗データを自動更新'
          branch: auto/update-stores
          delete-branch: true
          title: 'chore: 設置店舗データの自動更新'
          body: |
            設置店舗データ自動更新ワークフローが検出した差分です。

            - `src/data/stores.json`
            - `scripts/cache/geocode.json`

            内容を確認のうえ問題なければマージしてください。マージで Vercel の本番デプロイが発火します。

      # いずれかのステップが失敗したらIssueを作成（急減ガード中断・取得失敗の見逃し防止）
      - name: 失敗したらIssueを作成
        if: failure()
        uses: ./.github/actions/report-failure
