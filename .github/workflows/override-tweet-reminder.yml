name: Override tweet reminder

# src/data/overrides.json が更新（台数オーバーライドの書き込み）されたら、
# 修正ツイート（Xテンプレの2ツイート目＝【台数情報修正】／3ツイート目＝お礼＋メンション）の
# 下書きをIssueに出して、投稿し忘れを防ぐ軽量ワークフロー。差分→下書きの生成ロジックは
# scripts/override-tweet-draft.mjs（自己完結ESM・追加installなしでnode実行）に集約し、
# このワークフロー自体は node + gh の薄いプラミングに徹する。
#   - 2ツイート目: 今回 push の差分から「変化した台数・閉店」を店舗名つきで自動生成
#   - 位置・店舗詳細（フロア/喫煙所/録画/配信/営業時間/決済）の変化は店名だけの告知に回す
#   - 3ツイート目: お礼の定型（@メンションは公開の場由来のみ＝人手で。提供メモを参考表示）
#   - 同じ未対応Issueが開いていればコメントで集約（投稿後に手動クローズ→次の更新で新規作成）
#   - さらに当月の updates/override-reports/YYYY-MM.md へ下書きを自動追記し main に直コミット
#     （override-reports は paths 対象外＋[skip ci] で再発火しない。同一コミットは二重追記しない）

on:
  push:
    branches: [main]
    paths:
      - src/data/overrides.json

permissions:
  contents: write
  issues: write
  pull-requests: write

# 同時実行を直列化し、レポート追記PRの競合を防ぐ（実行中ジョブはキャンセルしない）
concurrency:
  group: override-tweet-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 修正ツイート下書きをIssue化
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # push 前後の overrides.json を用意（before が取れなければ空とみなす）
          cp src/data/overrides.json /tmp/after.json
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}:src/data/overrides.json" 2>/dev/null; then
            git show "${BEFORE}:src/data/overrides.json" > /tmp/before.json
          else
            echo '{"overrides":{}}' > /tmp/before.json
          fi

          today=$(date +%Y-%m-%d)
          short="${GITHUB_SHA:0:7}"

          # 差分検知〜下書き生成のロジックは scripts/override-tweet-draft.mjs に集約。
          # 依存 import を持たない自己完結 ESM なので runner の node で追加 install なしに実行できる。
          #   - /tmp/draft.md  … Issue 用の下書き本文
          #   - /tmp/report.md … 月次レポート追記本文
          #   - 標準出力 … 告知対象(admin の台数/閉店/位置/店舗詳細の変化)が有れば "true"
          has=$(node scripts/override-tweet-draft.mjs \
            --before /tmp/before.json --after /tmp/after.json --stores src/data/stores.json \
            --today "$today" --commit "$short" \
            --out-draft /tmp/draft.md --out-report /tmp/report.md)

          if [ "$has" != "true" ]; then
            echo "確定(admin)の台数・閉店・位置・店舗詳細の変化なし。Issueは作成しません。"
            exit 0
          fi

          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          label='要修正ツイート'
          title='🔧 台数・位置修正ツイートの下書き'
          gh label create "$label" --color FBCA04 --description 'オーバーライド更新→修正ツイート要' >/dev/null 2>&1 || true

          # 未対応(open)の同名Issueがあればコメントで集約、なければ新規作成
          existing=$(gh issue list --state open --label "$label" --limit 20 \
            --json number,title --jq "map(select(.title==\"$title\")) | .[0].number // empty")

          if [ -n "$existing" ]; then
            { printf '🔁 overrides.json がさらに更新されました（%s）。\n\n' "$commit_url"; cat /tmp/draft.md; } > /tmp/comment.md
            gh issue comment "$existing" --body-file /tmp/comment.md
            echo "既存Issue #$existing にコメントしました"
          else
            { printf 'overrides.json が更新されました（%s）。下記の修正ツイートを確認して投稿してください。投稿したらこのIssueを閉じてください。\n\n' "$commit_url"; cat /tmp/draft.md; } > /tmp/issue.md
            gh issue create --title "$title" --label "$label" --body-file /tmp/issue.md
            echo "新規Issueを作成しました"
          fi

          # ---- 当月の override-reports/YYYY-MM.md へ自動追記して main に直コミット ----
          month=$(date +%Y-%m)
          file="updates/override-reports/${month}.md"

          # 同一コミットは二重追記しない
          if [ -f "$file" ] && grep -q "$short" "$file"; then
            echo "コミット ${short} は ${file} に記録済み。追記をスキップします。"
            exit 0
          fi

          if [ ! -f "$file" ]; then
            printf '# 台数・位置オーバーライド 反映報告（%s ドラフト）\n\n`templates/override-report.md` の型で override-tweet-reminder が自動記録。\n' "$month" > "$file"
          fi
          cat /tmp/report.md >> "$file"
          echo "" >> "$file"
          echo "${file} へ追記しました（コミットは後続の create-pull-request 段でPR化）。"

      # main はブランチ保護下（直 push 不可）のため、レポート追記は固定ブランチ経由のPRにする。
      # 差分が無ければ peter-evans/create-pull-request は何もしない（PRも作らない）。
      # update-stores と同じ方式。レビュー・マージは人が行う。
      - name: レポート追記をPR化
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: updates/override-reports
          commit-message: 'docs(updates): 台数・位置修正報告に自動追記'
          branch: auto/override-report
          delete-branch: true
          title: 'docs(updates): 台数・位置修正報告の自動追記'
          body: |
            override-tweet-reminder が `src/data/overrides.json` の更新を検知し、当月の
            `updates/override-reports/` へ修正ツイートのドラフトを自動追記したものです。

            投稿用ドラフトは別途「🔧 台数・位置修正ツイートの下書き」Issueにも出ています。
            内容を確認のうえ問題なければマージしてください。

      - name: 失敗したらIssueを作成
        if: failure()
        uses: ./.github/actions/report-failure
