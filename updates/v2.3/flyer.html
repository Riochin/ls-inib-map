<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ラストサバイニブ ver 2.3 紹介</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --purple: #7B2FBE;
    --purple-soft: #F3E8FF;
    --purple-light: #C4A0E8;
    --blue: #2563EB;
    --blue-soft: #DBEAFE;
    --ink: #1f2433;
    --ink-soft: #5b6376;
    --round: "M PLUS Rounded 1c", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #cdd3e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
  }

  /* ===== 撮影枠 ===== */
  #flyer {
    position: relative;
    width: 1200px;
    height: 675px;
    overflow: hidden;
    border-radius: 28px;
    background:
      radial-gradient(1100px 520px at 88% -8%, rgba(123,47,190,0.18), transparent 60%),
      radial-gradient(900px 520px at 0% 110%, rgba(37,99,235,0.14), transparent 55%),
      linear-gradient(160deg, #fbfaff 0%, #f4f1fb 100%);
  }

  #flyer::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(123,47,190,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123,47,190,0.05) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 40%, #000 55%, transparent 100%);
  }

  .deco-pin {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: linear-gradient(135deg, var(--purple), var(--purple-light));
    box-shadow: 0 8px 16px rgba(123,47,190,0.25);
    opacity: 0.5;
  }
  .deco-pin::after {
    content: "";
    position: absolute;
    inset: 9px;
    background: #fff;
    border-radius: 50%;
  }
  .deco-pin.p1 { top: 34px; right: 206px; transform: rotate(-45deg) scale(0.8); opacity: 0.5; }
  .deco-pin.p2 { top: 158px; right: 192px; opacity: 0.5; }
  .deco-pin.p3 { top: 120px; right: 36px; transform: rotate(-45deg) scale(0.6); opacity: 0.3; }
  .deco-pin.b { background: linear-gradient(135deg, var(--blue), #93c5fd); box-shadow: 0 8px 16px rgba(37,99,235,0.22); }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 44px 52px 40px;
    display: flex;
    flex-direction: column;
  }

  /* ===== ヘッダー ===== */
  header { display: flex; align-items: flex-start; justify-content: space-between; }

  .ver-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--purple);
    color: #fff;
    font-family: var(--round);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.02em;
    padding: 8px 18px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(123,47,190,0.28);
  }
  .ver-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0.9; }

  .title {
    font-family: var(--round);
    font-weight: 800;
    font-size: 50px;
    line-height: 1.12;
    letter-spacing: 0.01em;
    margin-top: 18px;
  }
  .accent { color: var(--purple); }
  .subtitle {
    margin-top: 10px;
    font-size: 19px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .brand {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding-left: 24px;
    margin-right: 12px;
  }
  .brand-pin {
    width: 116px;
    height: auto;
    margin-top: 6px;
    filter: drop-shadow(0 14px 26px rgba(123,47,190,0.34));
  }

  /* ===== 機能カード ===== */
  .cards {
    margin-top: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .card {
    height: 335px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(123,47,190,0.10);
    border-radius: 20px;
    padding: 20px 20px 20px;
    box-shadow: 0 18px 40px rgba(70,40,110,0.12);
    display: flex;
    flex-direction: column;
  }
  .card .kicker {
    font-family: var(--round);
    font-weight: 700;
    font-size: 12.5px;
    color: var(--purple);
    background: var(--purple-soft);
    align-self: flex-start;
    padding: 4px 11px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }
  .card h3 {
    font-family: var(--round);
    font-weight: 700;
    font-size: 19px;
    margin-top: 12px;
    line-height: 1.3;
    color: var(--ink);
  }
  .card p {
    margin-top: 8px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .card-list {
    margin-top: 9px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    list-style: none;
  }
  .card-list li {
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-soft);
    display: flex;
    align-items: flex-start;
    gap: 7px;
  }
  .card-list li::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--purple);
    flex-shrink: 0;
    margin-top: 5px;
  }

  .preview {
    height: 130px;
    overflow: hidden;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #fff;
    border: 1px solid #eef0f6;
    border-radius: 14px;
    padding: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .preview.no-border {
    border: none;
    background: transparent;
    box-shadow: none;
    padding: 4px 0;
  }

  /* 店舗詳細パネル（ボトムシートヘッダー風） */
  .detail-panel {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .detail-panel .dp-name {
    font-family: var(--round);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
  }
  .detail-panel .dp-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .detail-panel .dp-chip {
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .detail-panel .dp-chip.hours   { background: #f0fdf4; color: #166534; }
  .detail-panel .dp-chip.rec-stream { background: var(--blue-soft); color: var(--blue); }
  .detail-panel .dp-chip.pay    { background: #fefce8; color: #854d0e; }
  .detail-panel .dp-divider {
    border: none;
    border-top: 1px solid #eef0f6;
    margin: 2px 0;
  }
  .detail-panel .dp-counts {
    display: flex;
    gap: 12px;
  }
  .detail-panel .dp-count {
    font-size: 10.5px;
    color: var(--ink-soft);
  }
  .detail-panel .dp-count b {
    font-family: var(--round);
    font-weight: 700;
    color: var(--ink);
  }

  /* ===== 属性アイコングリッド ===== */
  .attr-grid {
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 14px 48px;
    align-content: center;
    justify-content: center;
    height: 100%;
  }
  .attr-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }
  .attr-icon {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .attr-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    text-align: left;
    line-height: 1.2;
  }

  /* ===== フィードバックアイコン（card3）===== */
  .feedback-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
    height: 100%;
  }
  .fb-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 4px 10px;
    background: #f8f9fc;
    border: 1px solid #eef0f6;
    border-radius: 9px;
  }
  .fb-icon {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fb-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
  }

  /* ===== フッター ===== */
  footer {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .url {
    font-family: var(--round);
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .url .link-mark {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--purple);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .url .link-mark svg { width: 15px; height: 15px; }
  .hashtag {
    font-family: var(--round);
    font-weight: 700;
    font-size: 16px;
    color: var(--purple);
    background: var(--purple-soft);
    padding: 7px 16px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="flyer">
    <span class="deco-pin p1"></span>
    <span class="deco-pin p2 b"></span>
    <span class="deco-pin p3"></span>

    <div class="inner">
      <header>
        <div>
          <span class="ver-pill"><span class="dot"></span>新機能 ver 2.3</span>
          <h1 class="title">あなたの情報が、<span class="accent">地図になる</span>。</h1>
          <p class="subtitle">ラスサバ・イニブの設置店舗マップ アップデート</p>
        </div>
        <div class="brand">
          <svg class="brand-pin" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg" aria-label="ラストサバイニブ ロゴ">
            <defs>
              <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7B2FBE"/>
                <stop offset="30%" stop-color="#7B2FBE"/>
                <stop offset="100%" stop-color="#2563EB"/>
              </linearGradient>
            </defs>
            <path d="M14 0C6.268 0 0 6.268 0 14c0 7.732 14 22 14 22s14-14.268 14-22C28 6.268 21.732 0 14 0z" fill="url(#brand-grad)"/>
            <circle cx="14" cy="14" r="5" fill="white"/>
          </svg>
        </div>
      </header>

      <div class="cards">

        <!-- カード1+2: 店舗詳細 & 情報提供（結合・2列分） -->
        <div class="card" style="grid-column: span 2">
          <span class="kicker">店舗情報</span>
          <h3>台数だけじゃない。<span class="accent">設備情報</span>へ。</h3>
          <p style="font-size: 13px; color: #6b7280; margin: 6px 0 0; line-height: 1.5;">営業時間・録画台・配信台・決済手段など、知っている設備情報を地図画面からそのまま送れるようになりました。</p>
          <div class="preview no-border" style="flex: 1; height: auto; margin-top: 16px;">
            <div class="attr-grid">

              <!-- 台数 -->
              <div class="attr-item">
                <div class="attr-icon">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"/>
                    <line x1="6" y1="12" x2="10" y2="12"/>
                    <line x1="8" y1="10" x2="8" y2="14"/>
                    <circle cx="16" cy="11" r="1" fill="#2563EB"/>
                    <circle cx="18" cy="13" r="1" fill="#2563EB"/>
                  </svg>
                </div>
                <span class="attr-label">台数</span>
              </div>

              <!-- 録画台 -->
              <div class="attr-item">
                <div class="attr-icon">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"/>
                    <rect x="1" y="5" width="15" height="14" rx="2"/>
                  </svg>
                </div>
                <span class="attr-label">録画台</span>
              </div>

              <!-- フロア -->
              <div class="attr-item">
                <div class="attr-icon">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7B2FBE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                    <polyline points="2 17 12 22 22 17"/>
                    <polyline points="2 12 12 17 22 12"/>
                  </svg>
                </div>
                <span class="attr-label">フロア</span>
              </div>

              <!-- 営業時間 -->
              <div class="attr-item">
                <div class="attr-icon">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <polyline points="12 7 12 12 15 14"/>
                  </svg>
                </div>
                <span class="attr-label">営業時間</span>
              </div>

              <!-- 配信台 -->
              <div class="attr-item">
                <div class="attr-icon">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="5" width="20" height="14" rx="4" fill="#dc2626"/>
                    <polygon points="10,9 10,15 16,12" fill="white"/>
                  </svg>
                </div>
                <span class="attr-label">配信台</span>
              </div>

              <!-- 決済手段 -->
              <div class="attr-item">
                <div class="attr-icon">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ca8a04" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                    <line x1="1" y1="10" x2="23" y2="10"/>
                  </svg>
                </div>
                <span class="attr-label">決済手段</span>
              </div>

            </div>
          </div>
        </div>

        <!-- カード3: アプリ要望フォーム -->
        <div class="card">
          <span class="kicker">アプリ要望</span>
          <h3>要望・不具合を<br><span class="accent">アプリ内</span>から。</h3>
          <p>機能の改善提案や不具合を、地図画面からそのまま送れるようになりました。</p>
          <div class="preview no-border">
            <div class="feedback-items">

              <!-- 新機能の提案 -->
              <div class="fb-item">
                <div class="fb-icon" style="background:#fefce8">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ca8a04" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="9" y1="18" x2="15" y2="18"/>
                    <line x1="10" y1="22" x2="14" y2="22"/>
                    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14z"/>
                  </svg>
                </div>
                <span class="fb-label">新機能の提案</span>
              </div>

              <!-- 不具合の報告 -->
              <div class="fb-item">
                <div class="fb-icon" style="background:#fff1f2">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                  </svg>
                </div>
                <span class="fb-label">不具合の報告</span>
              </div>

              <!-- その他の意見 -->
              <div class="fb-item">
                <div class="fb-icon" style="background:var(--blue-soft)">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                </div>
                <span class="fb-label">その他の意見</span>
              </div>

            </div>
          </div>
        </div>

      </div>

      <footer>
        <span class="url">
          <span class="link-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
              <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
            </svg>
          </span>
          lsib.world
        </span>
        <span class="hashtag">#ラストサバイニブ</span>
      </footer>
    </div>
  </div>
</body>
</html>
